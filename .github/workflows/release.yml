name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write
  pages: write

jobs:
  build-installers:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            upload: |
              release/*.exe
              release/*.zip
            updateFile: release/latest*.yml
          - os: macos-latest
            script: dist:mac
            upload: |
              release/*.dmg
              release/*.zip
            updateFile: release/latest*.yml
          - os: ubuntu-latest
            script: dist:linux
            upload: |
              release/*.AppImage
              release/*.tar.gz
            updateFile: release/latest*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build installers
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            ${{ matrix.upload }}
            ${{ matrix.updateFile }}
          if-no-files-found: error

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Sync Capacitor
        run: npm run build:android
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/linuxbeste/calendar_noone_asked_for:latest
            ghcr.io/linuxbeste/calendar_noone_asked_for:${{ github.ref_name }}

  deploy-web:
    name: Live web (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build web client
        run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-installers, build-android, docker]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.apk
            release/*.zip
            release/*.tar.gz
            release/latest*.yml
          body: |
            ## Calendar No One Asked For ${{ github.ref_name }}

            ### Live version (web)
            Try it in the browser: https://linuxbeste.github.io/Calendar_noone_asked_for/

            ### Docker image
            ```
            docker pull ghcr.io/linuxbeste/calendar_noone_asked_for:latest
            docker run -p 3001:3001 -v calendar-data:/data -e CALENDAR_API_KEY=your-secret ghcr.io/linuxbeste/calendar_noone_asked_for:latest
            ```
            - Web client + API at http://localhost:3001
            - Data is stored in the `calendar-data` volume
            - Point the web app at a different server via Settings → API URL

            ### Installers
            - Windows: `.exe` (NSIS installer) or `.zip` (portable, no install)
            - macOS: `.dmg` or `.zip` (portable)
            - Linux: `.AppImage` or `.tar.gz` (portable)

            ### Mobile
            - Android: `.apk` (debug build)
          generate_release_notes: true