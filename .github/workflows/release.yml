name: Release

run-name: ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write
  pages: write

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

  build-installers:
    name: Installer (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            upload: |
              release/*.exe
              release/*.zip
            updateFile: release/latest*.yml
          - os: macos-latest
            script: dist:mac
            upload: |
              release/*.dmg
              release/*.zip
            updateFile: release/latest*.yml
          - os: ubuntu-latest
            script: dist:linux
            upload: |
              release/*.AppImage
              release/*.deb
            updateFile: release/latest*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install || npm install
      - name: Build installers
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            ${{ matrix.upload }}
            ${{ matrix.updateFile }}
          if-no-files-found: error

  build-android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install || npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Sync Capacitor
        run: npm run build:android
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  docker:
    name: Docker image (GHCR)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/linuxbeste/calendar_noone_asked_for:latest
            ghcr.io/linuxbeste/calendar_noone_asked_for:${{ github.ref_name }}

  deploy-web:
    name: Live web (GitHub Pages)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install || npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build web client
        run: npm run build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-installers, build-android, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog for this release
        run: awk '/^## \[Unreleased\]/{f=1; next} /^## \[/{f=0} f' CHANGELOG.md > /tmp/changelog.md
      - name: Compose release notes
        run: |
          {
            echo '## Calendar No One Asked For ${{ github.ref_name }}'
            echo ''
            echo '### What is new'
            echo '```markdown'
            cat /tmp/changelog.md
            echo '```'
            echo ''
            echo '### Live version (web)'
            echo 'Try it in the browser — no install, no account, seeded demo data:'
            echo ''
            echo 'https://linuxbeste.github.io/Calendar_noone_asked_for/'
            echo ''
            echo '### Downloads'
            echo 'One click per platform, always the latest version:'
            echo ''
            echo 'https://linuxbeste.github.io/Calendar_noone_asked_for/downloads.html'
            echo '- Windows: installer `.exe` + portable `.exe`'
            echo '- macOS: `.dmg` + portable `.zip`'
            echo '- Linux: installer `.deb` + portable `.AppImage`'
            echo '- Android: `.apk`'
            echo ''
            echo '### Deployment'
            echo 'This release is deployed to GitHub Pages automatically (live demo above).'
            echo 'Deployment history: repo Settings → Pages → Recent deployments.'
            echo ''
            echo '### Docker image'
            echo '```'
            echo 'docker pull ghcr.io/linuxbeste/calendar_noone_asked_for:latest'
            echo 'docker run -p 3001:3001 -v calendar-data:/data -e CALENDAR_API_KEY=your-secret ghcr.io/linuxbeste/calendar_noone_asked_for:latest'
            echo '```'
            echo '- Web client + API at http://localhost:3001'
            echo '- Data is stored in the `calendar-data` volume'
            echo '- Point the web app at a different server via Settings → API URL'
          } > /tmp/release-body.md
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.apk
            release/*.zip
            release/latest*.yml
          body_path: /tmp/release-body.md