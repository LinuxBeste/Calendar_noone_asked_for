services:
  postgres:
    image: postgres:17
    container_name: calendar-postgres
    environment:
      POSTGRES_USER: ${CALENDAR_PG_USER:-calendar}
      POSTGRES_PASSWORD: ${CALENDAR_PG_PASSWORD:-calendar}
      POSTGRES_DB: ${CALENDAR_PG_DB:-calendar}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CALENDAR_PG_USER:-calendar} -d ${CALENDAR_PG_DB:-calendar}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: calendar-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: ghcr.io/linuxbeste/calendar_noone_asked_for:latest
    build: .
    container_name: calendar-server
    ports:
      - "3001:3001"
    environment:
      CALENDAR_API_HOST: 0.0.0.0
      CALENDAR_API_PORT: 3001
      CALENDAR_API_KEY: ${CALENDAR_API_KEY:-}
      CALENDAR_PG_URL: postgres://${CALENDAR_PG_USER:-calendar}:${CALENDAR_PG_PASSWORD:-calendar}@postgres:5432/${CALENDAR_PG_DB:-calendar}
      CALENDAR_REDIS_URL: redis://redis:6379
      CALENDAR_WEB_DIR: /app/web/dist
      CALENDAR_DATA_DIR: /data
    volumes:
      - calendardata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  calendardata:
